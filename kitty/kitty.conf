# Colores: generados por hypr/scripts/theme-switch.sh (SUPER+T).
# theme.conf es un enlace a ~/.config/theme/kitty.conf
include theme.conf

# Transparencia
background_opacity 0.6
background_blur    16

# El click del medio (tocar/apretar el pad con 3 dedos) no pega nada: pegar solo con Ctrl+V / Ctrl+Shift+V
mouse_map middle release ungrabbed no_op
mouse_map middle press ungrabbed no_op
mouse_map shift+middle release ungrabbed,grabbed no_op
mouse_map shift+middle press ungrabbed,grabbed no_op
