# Una sola línea, sin salto en blanco entre comandos.
# Los colores son nombres ANSI (yellow, bright-red...): los pinta la paleta de
# kitty, así que cambian solos con el tema (SUPER+T).
add_newline = false

# Orden: carpeta, git, lenguaje/entorno, duración, error, flecha
format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$java\
$c\
$cmd_duration\
$status\
$character"""

[directory]
style = "bold yellow"
read_only = " [RO]"
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = "[ ❯](bold bright-green)"
error_symbol = "[ ❯](bold bright-red)"

[git_branch]
symbol = "git:"
style = "bold bright-purple"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold bright-red"
format = "([ $all_status$ahead_behind]($style))"

# Duración: solo si el comando tardó 2 s o más
[cmd_duration]
min_time = 2000
format = " [took $duration]($style)"
style = "yellow"

# Código de salida: solo si el comando falló
[status]
disabled = false
format = " [✗ $status]($style)"
style = "bold bright-red"

# Lenguajes: solo aparecen dentro de un proyecto de ese lenguaje
[python]
symbol = "py "
format = " [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "bright-blue"

[nodejs]
symbol = "node "
format = " [$symbol($version )]($style)"
style = "bright-green"

[rust]
symbol = "rs "
format = " [$symbol($version )]($style)"
style = "bright-red"

[golang]
symbol = "go "
format = " [$symbol($version )]($style)"
style = "bright-cyan"

[java]
symbol = "java "
format = " [$symbol($version )]($style)"
style = "bright-yellow"

[c]
symbol = "c "
format = " [$symbol($version )]($style)"
style = "bright-blue"

[package]
disabled = true
